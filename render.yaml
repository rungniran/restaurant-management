services:
  - type: web
    name: restaurant-management
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build:frontend
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: restaurant-management
          envVarKey: RENDER_EXTERNAL_URL
      - key: PLATFORM_ADMIN_ORIGIN
        fromService:
          type: web
          name: restaurant-platform-admin
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: restaurant-platform-admin
    runtime: static
    rootDir: frontend/platform-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: restaurant-management
          envVarKey: RENDER_EXTERNAL_URL
